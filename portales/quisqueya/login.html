    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body data-tema="qfd" class="auth-body">
    <main class="auth-card">
        <img src="imagenes/qfd.png" alt="Logo" class="logo-img" onerror="this.onerror=null;this.src='imagenes/proyectn.png'">
        <h1><span class="t-a">ASCENSOS</span> <span class="t-b">QFD</span></h1>
        <p class="auth-sub">by PROYECTN · ACCESO ADMIN</p>
        <form id="formLogin" data-portal="ascensosqfd" data-destino="admin.html" autocomplete="on">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="adminascensosqfd">
            </div>
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input id="clave" name="clave" type="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-generar">Ingresar</button>
            <p id="authMsg" class="auth-msg" role="alert"></p>
        </form>
        <a href="./" class="auth-back">← Volver al portal</a>
    </main>
    <script src="../../portal-kit/login.js?v=20261013e"></script>
</body>
