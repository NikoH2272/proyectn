<body>

<header class="site-header">
    <div class="logo-container">
        <img src="imagenes/proyectn.png" alt="Logo PROYECTN" class="logo-img" onerror="this.src=''">
        <div class="logo">PROYECTN</div>
    </div>
    <nav class="main-nav">
        <ul>
            <li><a href="../"><i class="fa-solid fa-house"></i> Portal</a></li>
            <li><a href="./"><i class="fa-solid fa-globe"></i> Historial</a></li>
            <li><a href="cupos.html" style="color: var(--primary);"><i class="fa-solid fa-ticket"></i> Cupos Disponibles</a></li>
        </ul>
    </nav>
</header>

<section class="hero" style="padding: 40px 20px;">
    <h1>Reserva tu <span>Cupo</span></h1>
    <p>Inscribe a tu equipo en las próximas sesiones de práctica oficiales.</p>
</section>

<main style="max-width: 1000px; margin: 40px auto; padding: 0 20px;" id="contenedorEntrenamientos">
    <div style="text-align:center; color:var(--primary); font-family:'Michroma'; padding:40px;">Buscando entrenamientos disponibles...</div>
</main>

<!-- MODAL DE REGISTRO -->
<div id="modalRegistro" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px);">
    <div style="background: var(--dark-card); border: 2px solid var(--primary); border-radius: 12px; max-width: 500px; width: 100%; padding: 30px; position: relative;">
        <button onclick="cerrarModal()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(216,195,149,0.3); color: #fff; width: 35px; height: 35px; border-radius: 50%; font-size: 1.1rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        <h3 id="modalTitulo" style="color: var(--primary); font-family: 'Michroma'; font-size: 1.3rem; margin-bottom: 20px; border-bottom: 1px solid rgba(216,195,149,0.2); padding-bottom: 10px;">Inscripción</h3>
        
        <input type="hidden" id="entrenamientoId">
        <input type="hidden" id="linkGrupoSecreto">

        <div style="margin-bottom: 15px;">
            <label style="color: var(--primary); font-family: 'Michroma'; font-size: 0.8rem;">NOMBRE DEL EQUIPO O JUGADOR</label>
            <input type="text" id="regNombre" placeholder="Ej: Pumas Squad" style="width: 100%; padding: 12px; background: #0a0b10; border: 1px solid rgba(216,195,149,0.3); color: #fff; border-radius: 6px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="color: var(--primary); font-family: 'Michroma'; font-size: 0.8rem;">TELÉFONO DE CONTACTO</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <select id="regPais" style="width: 130px; padding: 12px; background: #0a0b10; border: 1px solid rgba(216,195,149,0.3); color: #fff; border-radius: 6px;">
                    <option value="+57">🇨🇴 +57</option>
                    <option value="+52">🇲🇽 +52</option>
                    <option value="+54">🇦🇷 +54</option>
                    <option value="+55">🇧🇷 +55</option>
                    <option value="+56">🇨🇱 +56</option>
                    <option value="+51">🇵🇪 +51</option>
                    <option value="+593">🇪🇨 +593</option>
                    <option value="+58">🇻🇪 +58</option>
                    <option value="+591">🇧🇴 +591</option>
                    <option value="+595">🇵🇾 +595</option>
                    <option value="+598">🇺🇾 +598</option>
                    <option value="+592">🇬🇾 +592</option>
                    <option value="+502">🇬🇹 +502</option>
                    <option value="+504">🇭🇳 +504</option>
                    <option value="+503">🇸🇻 +503</option>
                    <option value="+505">🇳🇮 +505</option>
                    <option value="+506">🇨🇷 +506</option>
                    <option value="+507">🇵🇦 +507</option>
                    <option value="+501">🇧🇿 +501</option>
                    <option value="+1">🇺🇸 +1 (USA)</option>
                    <option value="+1">🇨🇦 +1 (CA)</option>
                    <option value="+1">🇩🇴 +1 (RD)</option>
                    <option value="+1">🇵🇷 +1 (PR)</option>
                    <option value="+1">🇯🇲 +1 (JM)</option>
                    <option value="+1">🇹🇹 +1 (TT)</option>
                    <option value="+53">🇨🇺 +53</option>
                    <option value="+509">🇭🇹 +509</option>
                    <option value="+">🌍 Otro</option>
                </select>
                <input type="number" id="regTelefono" placeholder="Número (Sin espacios)" style="flex: 1; padding: 12px; background: #0a0b10; border: 1px solid rgba(216,195,149,0.3); color: #fff; border-radius: 6px;">
            </div>
        </div>

        <button onclick="procesarInscripcion()" class="btn-access" style="width: 100%; padding: 12px; text-align: center; border: none; font-size: 1rem; cursor: pointer;">CONFIRMAR INSCRIPCIÓN</button>
    </div>
</div>

<script src="script_cupos.js?v=20261013e"></script>
