<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar sesión | Ascensos Pumas Gaming by PROYECTN</title>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../portal-kit/portal.css?v=20261023a">
    <link rel="icon" href="../../imagenes/LOGO PUMAS WEB.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../portal-kit/portal.js?v=20261023a" data-portal="ascensospumasgaming" data-modo="login"></script>
</head>
<body data-tema="corp" class="auth-body">
    <main class="auth-card">
        <img src="../../imagenes/LOGO PUMAS WEB.png" alt="Logo Pumas Gaming" class="logo-img">
        <h1><span class="t-a">ASCENSOS</span> <span class="t-b">PUMAS GAMING</span></h1>
        <p class="auth-sub">by PROYECTN · ACCESO ADMIN</p>
        <form id="formLogin" data-portal="ascensospumasgaming" data-destino="admin.html" autocomplete="on">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="adminpumas">
            </div>
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input id="clave" name="clave" type="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-generar">Ingresar</button>
            <p id="authMsg" class="auth-msg" role="alert"></p>
        </form>
        <a href="./" class="auth-back">← Volver al portal</a>
    </main>
    <script src="../../../portal-kit/login.js?v=20261023a"></script>
</body>
</html>
