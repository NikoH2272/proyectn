    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar Sesión | PROYECTN</title>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Emilys+Candy&family=Jersey+25&family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

<body class="auth-overlay">

    <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin" data-portal="entrenamientos" data-destino="admin.html" autocomplete="on">
            <div class="form-group-auth">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="coachniko">
            </div>
            <div class="form-group-auth">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-auth">Ingresar al Panel</button>
            <p id="authMsg" class="error-msg" role="alert"></p>
        </form>
        <p style="margin-top: 20px; font-size: 0.9rem;"><a href="./" style="color: var(--primary);">← Volver a Entrenamientos</a></p>
    </div>

    <script src="../../portal-kit/login.js?v=20261013e"></script>
</body>
