<script>
    // Mostrar link Dinámicas si hay dinámica activa
    (async function () {
        for (const tipo of ['registro', 'encuesta']) {
            try {
                const r = await PumasPortal.dinamica.publico('entrenamientos', tipo);
                if (r && r.activo) { document.getElementById('navDinamicas').hidden = false; return; }
            } catch(e) {}
        }
        try {
            const lista = await PumasPortal.enc.publico('entrenamientos');
            if (lista && lista.length) { document.getElementById('navDinamicas').hidden = false; }
        } catch(e) {}
    })();
</script>
