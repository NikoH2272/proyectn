<style>
  :root { --primary: #D8C395; --bg-a: #0A0A0A; --bg-b: #131313; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-a); color: var(--light, #e8e0d0); text-align: center; padding: 2rem; }
  .cuatro-cero-cuatro { font-family: 'Michroma', sans-serif; font-size: clamp(5rem, 25vw, 10rem); color: var(--primary); line-height: 1; letter-spacing: .05em; text-shadow: 0 0 60px rgba(var(--primary-rgb,216,195,149),.35); }
  h1 { font-family: 'Michroma', sans-serif; font-size: clamp(1rem, 4vw, 1.6rem); margin: .5rem 0 1.2rem; color: var(--light, #e8e0d0); }
  p  { color: var(--gray, #888); max-width: 36ch; line-height: 1.6; margin: 0 auto 2.2rem; }
  .btns { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }
  .btn-pri  { background: var(--primary); color: #0a0a0a; padding: .65rem 1.6rem; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: .9rem; transition: opacity .15s; }
  .btn-pri:hover { opacity: .85; }
  .btn-sec  { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); padding: .65rem 1.6rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: .9rem; transition: background .15s, color .15s; }
  .btn-sec:hover { background: var(--primary); color: #0a0a0a; }
  .logo-img { width: 72px; margin-bottom: 1.5rem; opacity: .7; }
  .links { margin-top: 3rem; display: flex; gap: 1.4rem; flex-wrap: wrap; justify-content: center; }
  .links a { color: var(--gray, #888); text-decoration: none; font-size: .8rem; transition: color .15s; }
  .links a:hover { color: var(--primary); }
</style>
</head>

  <img src="/imagenes/proyectn.png" alt="PROYECTN" class="logo-img" onerror="this.style.display='none'">
